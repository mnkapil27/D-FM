services:
  - type: web
    name: facebook-ads-mcp
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m fb_ads_mcp
    healthCheckPath: /health
    envVars:
      - key: META_ACCESS_TOKEN
        sync: false
      - key: MCP_AUTH_TOKEN
        sync: false
      - key: CLIENTS_JSON
        sync: false
      - key: META_API_VERSION
        value: v23.0
